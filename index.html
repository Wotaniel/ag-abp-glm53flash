<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdGuard: Блокировщик рекламы — превью анимации</title>
<meta name="description" content="Превью анимации App Store для AdGuard: Блокировщик рекламы — зацикленный ролик, скриншоты, ссылки.">
<style>
  :root{
    --bg:#05070a;
    --panel:#0d1117;
    --line:#1d2733;
    --txt:#e8ecf2;
    --dim:#8b94a3;
    --green:#68bc51;
    --green-btn:#1d2b24;
    --green-line:#2e4438;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--txt);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ---------- hero (fills first screen) ---------- */
  .hero{
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:radial-gradient(1200px 700px at 50% -10%, #12200f 0%, var(--bg) 60%);
  }
  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
  }
  header .icon{
    width:42px;height:42px;
    border-radius:10px;
    display:block;
    box-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .titles{flex:1;min-width:0}
  .titles h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titles p{margin:1px 0 0;font-size:12px;color:var(--dim)}
  .cta{display:flex;gap:10px;flex-shrink:0}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:10px;
    font-size:13px;font-weight:600;text-decoration:none;
    border:1px solid transparent;cursor:pointer;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--green);color:#071307}
  .btn.primary:hover{background:#79cf62}
  .btn.primary svg{width:15px;height:15px;fill:currentColor}
  .btn.ghost{background:#12161f;border-color:var(--line);color:var(--txt)}
  .btn.ghost:hover{border-color:#33415a;background:#171d29}

  /* ---------- stage ---------- */
  #stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    padding:22px 16px 10px;
    position:relative;
  }
  .video-wrap{position:relative;max-width:min(94vw,1180px)}
  video{
    display:block;
    width:100%;
    max-height:calc(100vh - 300px);
    min-height:200px;
    border-radius:12px;
    border:1px solid var(--line);
    box-shadow:0 24px 80px rgba(0,0,0,.6), 0 4px 18px rgba(0,0,0,.5);
    background:#000;
    cursor:pointer;
  }
  #overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;border-radius:12px;
    background:rgba(0,0,0,.35);
  }
  #overlay[hidden]{display:none}
  #overlay .disc{
    width:72px;height:72px;border-radius:50%;
    background:rgba(13,17,23,.85);
    border:1px solid var(--green-line);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
  }
  #overlay .disc svg{width:26px;height:26px;fill:var(--green);margin-left:4px}

  /* ---------- control bar (по мотивам tengu-preview) ---------- */
  #bar{
    height:60px;
    display:flex;gap:14px;align-items:center;
    padding:0 18px;
    margin:14px 16px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    color:#cfe8d5;
    font:12.5px/1 ui-monospace, Menlo, monospace;
  }
  #bar button{
    background:var(--green-btn);
    color:#cfe8d5;
    border:1px solid var(--green-line);
    border-radius:8px;
    width:38px;height:34px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  #bar button:hover{background:#27402f}
  #bar button svg{width:14px;height:14px;fill:currentColor}
  #bar .ico-pause{display:none}
  #bar.playing .ico-pause{display:block}
  #bar.playing .ico-play{display:none}
  #time{min-width:104px;text-align:right;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--green);height:4px;cursor:pointer}
  .hint{color:var(--dim);white-space:nowrap}
  @media (max-width:640px){ .hint{display:none} #time{min-width:80px} }

  /* ---------- screenshots ---------- */
  .shots{padding:34px 24px 70px;border-top:1px solid var(--line)}
  .shots h2{margin:0 0 4px;font-size:18px;font-weight:600}
  .shots .sub{margin:0 0 22px;font-size:13px;color:var(--dim)}
  .row{
    display:flex;gap:18px;
    overflow-x:auto;
    padding:6px 2px 18px;
    scroll-snap-type:x mandatory;
  }
  .row a{
    flex:0 0 auto;
    scroll-snap-align:start;
    border-radius:16px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .row a:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 40px rgba(0,0,0,.55);
  }
  .row img{
    display:block;
    width:min(240px, 62vw);
    border-radius:16px;
    border:1px solid var(--line);
  }

  footer{
    padding:0 24px 40px;
    text-align:center;
    color:var(--dim);
    font-size:12px;
  }
  footer a{color:var(--dim)}
</style>
</head>
<body>

<div class="hero">
  <header>
    <img class="icon" src="assets/icon.png" alt="Иконка AdGuard: Блокировщик рекламы">
    <div class="titles">
      <h1>AdGuard: Блокировщик рекламы</h1>
      <p>Превью анимации · App Store</p>
    </div>
    <div class="cta">
      <a class="btn primary" href="https://apps.apple.com/ru/app/id1047223162" target="_blank" rel="noopener">
        <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        App Store
      </a>
      <a class="btn ghost" href="https://adguard.com" target="_blank" rel="noopener">adguard.com</a>
    </div>
  </header>

  <div id="stage">
    <div class="video-wrap">
      <video id="loop" src="assets/loop.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
      <div id="overlay" hidden>
        <div class="disc">
          <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div id="bar">
    <button id="playpause" aria-label="Играть / пауза">
      <svg class="ico-play" viewBox="0 0 384 512" aria-hidden="true"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>
      <svg class="ico-pause" viewBox="0 0 320 512" aria-hidden="true"><path d="M48 64C21.5 64 0 85.5 0 112V400c0 26.5 21.5 48 48 48H80c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H48zm192 0c-26.5 0-48 21.5-48 48V400c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H240z"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Позиция в ролике">
    <span id="time">0:00 / 0:00</span>
    <span class="hint">луп · без звука</span>
  </div>
</div>

<section class="shots">
  <h2>Скриншоты из App Store</h2>
  <p class="sub">Нажмите на скриншот, чтобы открыть в полном размере</p>
  <div class="row">
    <a href="assets/shot1.png" target="_blank" rel="noopener" aria-label="Открыть скриншот 1"><img src="assets/shot1.png" alt="Скриншот 1 — блокировка рекламы" loading="lazy"></a>
    <a href="assets/shot2.png" target="_blank" rel="noopener" aria-label="Открыть скриншот 2"><img src="assets/shot2.png" alt="Скриншот 2 — защита от трекинга" loading="lazy"></a>
    <a href="assets/shot3.png" target="_blank" rel="noopener" aria-label="Открыть скриншот 3"><img src="assets/shot3.png" alt="Скриншот 3 — статистика блокировок" loading="lazy"></a>
    <a href="assets/shot4.png" target="_blank" rel="noopener" aria-label="Открыть скриншот 4"><img src="assets/shot4.png" alt="Скриншот 4 — свои фильтры" loading="lazy"></a>
  </div>
</section>

<footer>
  Зацикленный ролик · 1920×824 · без звука ·
  <a href="https://apps.apple.com/ru/app/id1047223162" target="_blank" rel="noopener">App Store</a> ·
  <a href="https://adguard.com" target="_blank" rel="noopener">adguard.com</a>
</footer>

<script>
(function(){
  var v = document.getElementById('loop');
  var bar = document.getElementById('bar');
  var btn = document.getElementById('playpause');
  var seek = document.getElementById('seek');
  var timeEl = document.getElementById('time');
  var overlay = document.getElementById('overlay');
  var scrubbing = false;

  v.muted = true;

  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }
  function sync(){
    if(!scrubbing && v.duration) seek.value = v.currentTime;
    timeEl.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
  }
  function toggle(){
    if(v.paused) v.play(); else v.pause();
  }

  v.addEventListener('loadedmetadata', function(){
    seek.max = v.duration || 0;
    sync();
  });
  v.addEventListener('play', function(){
    bar.classList.add('playing');
    overlay.hidden = true;
  });
  v.addEventListener('pause', function(){
    bar.classList.remove('playing');
  });
  v.addEventListener('timeupdate', sync);

  // плавная синхронизация скраба
  (function tick(){ sync(); requestAnimationFrame(tick); })();

  // автоплей мог быть заблокирован — покажем большую кнопку
  var p = v.play();
  if(p && p.catch) p.catch(function(){ overlay.hidden = false; });

  btn.addEventListener('click', toggle);
  v.addEventListener('click', toggle);
  overlay.addEventListener('click', function(){ v.play(); });

  seek.addEventListener('pointerdown', function(){ scrubbing = true; });
  window.addEventListener('pointerup', function(){ scrubbing = false; });
  seek.addEventListener('input', function(){
    if(v.duration) v.currentTime = parseFloat(seek.value);
  });

  document.addEventListener('keydown', function(e){
    var t = e.target.tagName;
    if(e.code === 'Space' && t !== 'INPUT' && t !== 'BUTTON' && t !== 'A'){
      e.preventDefault();
      toggle();
    }
  });
})();
</script>

</body>
</html>
